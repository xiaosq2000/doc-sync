<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-labelledby="title desc">
  <title id="title">Docstale in an agent session</title>
  <desc id="desc">An agent renames connect() to open() in src/client.py. README.md still says connect(), so the docstale Stop hook reports README.md with the changed source. A reviewer subagent finds the Usage section affected. The agent updates README.md and runs docstale stamp, which records the review in docstale.lock.</desc>
  <style>
    svg {
      --bg: #ffffff; --card: #f6f8fa; --line: #d0d7de; --fg: #1f2328; --muted: #59636e;
      --amber: #9a6700; --amber-bg: #fff8c5; --green: #1a7f37; --green-bg: #dafbe1;
      --blue: #0969da; --blue-bg: #ddf4ff;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --card: #161b22; --line: #3d444d; --fg: #e6edf3; --muted: #9198a1;
        --amber: #d29922; --amber-bg: #3a2d0b; --green: #3fb950; --green-bg: #12301b;
        --blue: #4493f8; --blue-bg: #0f2744;
      }
    }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: var(--bg); stroke: var(--line); }
    .card { fill: var(--card); stroke: var(--line); }
    .fg { fill: var(--fg); }
    .muted { fill: var(--muted); }
    .blue { fill: var(--blue); }
    .label { font-size: 11px; letter-spacing: 0.08em; font-weight: 600; fill: var(--muted); }
    .s12 { font-size: 12px; }
    .s13 { font-size: 13px; }
    .s14 { font-size: 14px; }
    .b { font-weight: 600; }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .dot { fill: var(--line); }

    /* Still frame: the end of the story. Animation replays it. */
    .code-old, .readme-old, .lock-old, .badge-stale, .wire-hot, .wrong, .flash { opacity: 0; }
    .wire-hot { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 6 6; }
    .wrong path { fill: none; stroke: var(--amber); stroke-width: 1.5; }
    .badge-ok { transform-box: fill-box; transform-origin: center; }

    .a { animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .stage { animation-name: stage; }
    .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; }
    .l3b { animation-name: l3b; } .l4 { animation-name: l4; } .l5 { animation-name: l5; }
    .l6 { animation-name: l6; } .l6b { animation-name: l6b; }
    .code-old { animation-name: code-old; } .code-new { animation-name: code-new; }
    .readme-old { animation-name: readme-old; } .readme-new { animation-name: readme-new; }
    .lock-old { animation-name: lock-old; } .lock-new { animation-name: lock-new; }
    .flash1 { animation-name: flash1; } .flash2 { animation-name: flash2; } .flash3 { animation-name: flash3; }
    .wrong { animation-name: wrong; }
    .badge-stale { animation-name: stale; }
    .badge-ok { animation-name: badge-ok; }
    .wire-hot { animation: stale 20s ease-out infinite, flow 0.8s linear infinite; }

    /* The scene fades out at 94.5% and every element resets at 95%. */
    @keyframes stage { 0%, 92% { opacity: 1; } 94.5%, 96% { opacity: 0; } 99%, 100% { opacity: 1; } }
    @keyframes l1 { 0%, 3% { opacity: 0; } 4%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes l2 { 0%, 10% { opacity: 0; } 11%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes l3 { 0%, 20% { opacity: 0; } 21%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes l3b { 0%, 21.5% { opacity: 0; } 22.5%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes l4 { 0%, 35% { opacity: 0; } 36%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes l5 { 0%, 45% { opacity: 0; } 46%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes l6 { 0%, 55% { opacity: 0; } 56%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes l6b { 0%, 56.5% { opacity: 0; } 57.5%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes code-old { 0%, 11.5% { opacity: 1; } 12.5%, 94.5% { opacity: 0; } 95%, 100% { opacity: 1; } }
    @keyframes code-new { 0%, 11.5% { opacity: 0; } 12.5%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes readme-old { 0%, 46.5% { opacity: 1; } 47.5%, 94.5% { opacity: 0; } 95%, 100% { opacity: 1; } }
    @keyframes readme-new { 0%, 46.5% { opacity: 0; } 47.5%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes lock-old { 0%, 57% { opacity: 1; } 58%, 94.5% { opacity: 0; } 95%, 100% { opacity: 1; } }
    @keyframes lock-new { 0%, 57% { opacity: 0; } 58%, 94.5% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes flash1 { 0%, 11% { opacity: 0; } 12% { opacity: 1; } 17%, 100% { opacity: 0; } }
    @keyframes flash2 { 0%, 46% { opacity: 0; } 47% { opacity: 1; } 52%, 100% { opacity: 0; } }
    @keyframes flash3 { 0%, 57% { opacity: 0; } 58% { opacity: 1; } 63%, 100% { opacity: 0; } }
    @keyframes wrong { 0%, 14.5% { opacity: 0; } 15.5%, 46.5% { opacity: 1; } 47.5%, 100% { opacity: 0; } }
    @keyframes stale { 0%, 13.5% { opacity: 0; } 14.5%, 56.5% { opacity: 1; } 57.5%, 100% { opacity: 0; } }
    @keyframes badge-ok {
      0%, 13.5% { opacity: 1; transform: scale(1); }
      14.5%, 56.5% { opacity: 0; transform: scale(1.6); }
      57.5% { opacity: 1; transform: scale(0.9); }
      58.5%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes flow { to { stroke-dashoffset: -12; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="859" height="539" rx="12"/>

  <g class="a stage">
    <!-- Repository -->
    <text class="sans label" x="24" y="34">REPOSITORY</text>

    <rect class="card" x="24" y="48" width="280" height="72" rx="8"/>
    <text class="mono s12 muted" x="40" y="72">src/client.py</text>
    <rect class="a flash flash1" x="32" y="84" width="200" height="24" rx="4" fill="var(--amber-bg)"/>
    <text class="a mono s14 fg code-old" x="40" y="101">def connect(url): ...</text>
    <text class="a mono s14 fg code-new" x="40" y="101">def open(url): ...</text>

    <rect class="card" x="24" y="136" width="280" height="40" rx="8"/>
    <text class="mono s12 muted" x="40" y="161">pyproject.toml</text>

    <path class="wire" d="M304 84 H440"/>
    <path class="a wire-hot" d="M304 84 H440"/>
    <path class="wire" d="M304 156 C372 156 372 132 440 132"/>
    <circle class="dot" cx="440" cy="84" r="3"/>
    <circle class="dot" cx="440" cy="132" r="3"/>

    <rect class="card" x="440" y="48" width="396" height="128" rx="8"/>
    <text class="mono s12 muted" x="456" y="72">README.md</text>
    <g class="a badge-ok">
      <rect x="708" y="57" width="116" height="24" rx="12" fill="var(--green-bg)" stroke="var(--green)"/>
      <text class="sans s12 b" x="766" y="73" text-anchor="middle" fill="var(--green)">✓ reviewed</text>
    </g>
    <g class="a badge-stale">
      <rect x="708" y="57" width="116" height="24" rx="12" fill="var(--amber-bg)" stroke="var(--amber)"/>
      <text class="sans s12 b" x="766" y="73" text-anchor="middle" fill="var(--amber)">needs review</text>
    </g>
    <text class="mono s13 muted" x="456" y="108">## Usage</text>
    <rect class="a flash flash2" x="448" y="123" width="190" height="24" rx="4" fill="var(--green-bg)"/>
    <text class="a mono s14 fg readme-old" x="456" y="140">client.connect(url)</text>
    <text class="a mono s14 fg readme-new" x="456" y="140">client.open(url)</text>
    <g class="a wrong">
      <path d="M456 146 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3"/>
      <text class="sans s12" x="636" y="140" font-style="italic" fill="var(--amber)">out of date</text>
    </g>

    <text class="mono s12 fg" x="24" y="204"><tspan class="muted">docstale.toml</tspan><tspan dx="10">"README.md" = ["src/", "pyproject.toml"]</tspan></text>
    <rect class="a flash flash3" x="460" y="188" width="384" height="24" rx="4" fill="var(--blue-bg)"/>
    <text class="a mono s12 fg lock-old" x="836" y="204" text-anchor="end"><tspan class="muted">docstale.lock</tspan><tspan dx="10">"README.md" = "fda162360b901421"</tspan></text>
    <text class="a mono s12 fg lock-new" x="836" y="204" text-anchor="end"><tspan class="muted">docstale.lock</tspan><tspan dx="10">"README.md" = "3b7e0c94a1d25f68"</tspan></text>

    <line x1="24" y1="228" x2="836" y2="228" stroke="var(--line)"/>

    <!-- Agent session -->
    <text class="sans label" x="24" y="256">AGENT SESSION</text>

    <text class="a mono s13 fg l1" x="24" y="286"><tspan class="muted">›</tspan><tspan dx="8">Rename connect() to open()</tspan></text>
    <text class="a mono s13 fg l2" x="24" y="312">● <tspan class="b">Edit</tspan> src/client.py</text>
    <text class="a mono s13 fg l3" x="24" y="338">● <tspan class="b">Stop hook</tspan> <tspan class="blue">docstale hook</tspan></text>
    <g class="a l3b">
      <rect x="40" y="350" width="796" height="78" rx="6" fill="var(--blue-bg)"/>
      <rect x="40" y="350" width="3" height="78" fill="var(--blue)"/>
      <text class="mono s13 fg b" x="58" y="372">Documentation needs review.</text>
      <text class="mono s13 fg" x="58" y="394">README.md (changed since 9c1b2e7d41f0)</text>
      <text class="mono s13 fg" x="74" y="414">src/client.py</text>
    </g>
    <text class="a mono s13 fg l4" x="24" y="452">● <tspan class="b">reviewer subagent</tspan><tspan dx="10">affected: Usage still calls connect()</tspan></text>
    <text class="a mono s13 fg l5" x="24" y="478">● <tspan class="b">Edit</tspan> README.md</text>
    <text class="a mono s13 fg l6" x="24" y="504">● <tspan class="b">Bash</tspan> docstale stamp README.md</text>
    <text class="a mono s13 blue l6b" x="300" y="504">stamped README.md</text>
  </g>
</svg>
